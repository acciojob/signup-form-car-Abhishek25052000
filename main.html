<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
	</head>
	<body>
		<form method="post">
			<label for="name">Name</label>
			<input type="text" id="name" placeholder="Name"> <br><br>
			<label for="email">Email</label>
			<input type="email" id="email" placeholder="Email"><br><br>
			<input type="radio" name="Male1" id="gender_m">Male<br><br>
			<input type="radio" name="Female1" id="gender_f">Female<br><br>
			<select id="cars" placeholder="BMW">
				<option>BMW</option>
				<option>Maruti Suzuki</option>
				<option>Ferari</option>
			</select><br><br>
			<label for="age">Age</label>
			<input type="number" id="age" placeholder="Age"><br><br>
			<label for="dob">DOB</label>
			<input type="date" id="dob"><br><br>
			<label for="tel">Phone Number</label>
			<input type="number" id="tel" placeholder="xxx-xxx-xxxx"><br><br>
			<label for="password">Password</label>
			<input type="password" id="password" placeholder="Password"><br><br>
			<input type="checkbox" id="tos">I agree to the TOS
		</form>
	</body>
</html>
