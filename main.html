<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
	</head>
	<body>
		<form method="post">
			<label for="name">Name</label>
			<input type="text" id="name" placeholder="Name" required> <br><br>
			<label for="email">Email</label>
			<input type="email" id="email" placeholder="Email" required><br><br>
			<label for="gender_m">Male</label>
			<input type="radio" name="gender" id="gender_m"><br><br>
			<label for="gender_f">Female</label>
			<input type="radio" name="gender" id="gender_f"><br><br>
			<select id="cars" placeholder="cars" required>
				<option>BMW</option>
				<option>Maruti Suzuki</option>
				<option>Ferari</option>
			</select><br><br>
			<label for="age">Age</label>
			<input type="number" id="age" placeholder="Age" required><br><br>
			<label for="dob">DOB</label>
			<input type="date" id="dob" required><br><br>
			<label for="tel">Phone Number</label>
			<input type="tel" id="tel" placeholder="xxx-xxx-xxxx"><br><br>
			<label for="password">Password</label>
			<input type="password" id="password" placeholder="Password" required><br><br>
			<label for="tos">I agree to the TOS</label>
			<input type="checkbox" id="tos" required>
			<input type="submit" value="Submit">
		</form>
	</body>
</html>
